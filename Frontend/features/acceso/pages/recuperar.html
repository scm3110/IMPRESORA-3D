<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contrase&#241;a | Laboratorio 3D SENA</title>
    <link rel="stylesheet" href="../../../vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../../shared/styles/base.css">
    <link rel="stylesheet" href="../../../shared/styles/components.css">
    <link rel="stylesheet" href="../../../shared/styles/acceso.css">
    <script src="../../../shared/scripts/layout.js" defer></script>
  </head>
  <body class="acceso" data-layout="acceso" data-modulo="acceso">
    <a class="salto" href="#contenido">Saltar al contenido</a>
    <noscript><p class="error-layout">Activa JavaScript para mostrar el menú y los bloques compartidos.</p></noscript>
    <main id="contenido" tabindex="-1">
      <span class="muestra">Maqueta estática</span>

      <h1>Recuperar contraseña</h1>
      <p>Indica un correo de ejemplo. La maqueta no envía correos.</p>
      <form class="panel formulario" action="codigo.html" method="get" autocomplete="off">
        <fieldset>
          <legend>Correo de recuperación</legend>
          <div class="campos">
            <div class="campo">
              <label for="correo">Correo institucional</label>
              <input class="form-control" id="correo" type="email" required>
            </div>
          </div>
        </fieldset>
        <p class="ayuda">Usa datos ficticios. El navegador comprueba los campos y descarta los valores al continuar.</p>

        <div class="acciones">
          <button type="submit" class="btn accion">Enviar código</button>
          <a href="index.html" class="btn secundaria">Volver</a>
        </div>
      </form>
      <a href="index.html">Volver al inicio de sesión</a>

    </main>
  </body>
</html>
