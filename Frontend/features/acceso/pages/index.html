<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesi&#243;n | Laboratorio 3D SENA</title>
    <link rel="stylesheet" href="../../../vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../../shared/styles/base.css">
    <link rel="stylesheet" href="../../../shared/styles/components.css">
    <link rel="stylesheet" href="../../../shared/styles/acceso.css">
    <script src="../../../shared/scripts/layout.js" defer></script>
  </head>
  <body class="acceso" data-layout="acceso" data-modulo="acceso">
    <a class="salto" href="#contenido">Saltar al contenido</a>
    <noscript><p class="error-layout">Activa JavaScript para mostrar el menú y los bloques compartidos.</p></noscript>
    <main id="contenido" tabindex="-1">
      <!-- Inicio del formulario de inicio de sesión. -->
      <div class="contenido-formulario">
        <h1>Iniciar sesión</h1>
        <p>Ingrese con su correo institucional SENA.</p>
        <form class="formulario" action="../../dashboard/pages/index.html" method="get" autocomplete="off">
          <div class="campo">
            <label for="correo">Correo</label>
            <input class="form-control" id="correo" type="email" required autocomplete="username" placeholder="usuario@sena.edu.co">
          </div>
          <div class="campo">
            <label for="clave">Contraseña</label>
            <input class="form-control" id="clave" type="password" required autocomplete="current-password" placeholder="Ingrese su contraseña">
          </div>
          <p class="ayuda">Maqueta estática. El acceso y la validación de credenciales son solo de muestra.</p>
          <button type="submit" class="btn accion">Ingresar</button>
        </form>
        <a class="enlace-recuperacion" href="recuperar.html">¿Olvidó su contraseña?</a>
      </div>
      <!-- Fin del formulario de inicio de sesión. -->


    </main>
  </body>
</html>
